[package]
name = "vin"
version = "1.2.0"
edition = "2021"
description = "Initialise research paper workspaces from YAML directory templates"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
toml = "1.2.1"

[dev-dependencies]
tempfile = "3.27.0"
